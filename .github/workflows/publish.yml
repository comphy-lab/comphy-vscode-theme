name: Publish Extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag at the selected main commit (vMAJOR.MINOR.PATCH)'
        required: true
        type: string
      dry_run:
        description: 'Validate packaging only; do not publish'
        type: boolean
        default: true

# One publish at a time; a re-fired event queues instead of racing.
concurrency:
  group: publish-extension
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_publish: ${{ steps.check_versions.outputs.should_publish }}
      vs_exists: ${{ steps.check_versions.outputs.vs_exists }}
      ovsx_exists: ${{ steps.check_versions.outputs.ovsx_exists }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify tagged release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use an exact vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          tagged_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          if [[ "$tagged_sha" != "$RELEASE_SHA" || "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::The tag must point to the exact default-branch commit selected for this run."
            exit 1
          fi
          version=$(node -p 'require("./package.json").version')
          if ! node -e 'const p=require("./package.json"); if (["main","browser","activationEvents"].some(k=>Object.hasOwn(p,k))) process.exitCode=1'; then
            echo "::error::This theme package must not define an editor extension entry point."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::The release tag must match the version in package.json."
            exit 1
          fi

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce@4.1.1 ovsx@1.4.0

      - name: Validate package without publishing
        if: inputs.dry_run
        run: vsce package --out "$RUNNER_TEMP/comphy-theme.vsix"

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check existing versions
        id: check_versions
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          VS_EXISTS="false"
          OVSX_EXISTS="false"

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Running in test mode - skipping version checks"
            echo "vs_exists=false" >> $GITHUB_OUTPUT
            echo "ovsx_exists=false" >> $GITHUB_OUTPUT
            echo "should_publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Checking version $VERSION on VS Marketplace..."
          if vsce show vatsalsy.comphy-theme $VERSION --json 2>/dev/null | grep -q "\"version\": \"$VERSION\""; then
            VS_EXISTS="true"
            echo "::notice::Version $VERSION already exists on VS Marketplace"
          else
            echo "Version $VERSION does not exist on VS Marketplace"
          fi

          echo "Checking version $VERSION on Open VSX Registry..."
          if ovsx get vatsalsy.comphy-theme $VERSION --json 2>/dev/null | grep -q "\"version\": \"$VERSION\""; then
            OVSX_EXISTS="true"
            echo "::notice::Version $VERSION already exists on Open VSX Registry"
          else
            echo "Version $VERSION does not exist on Open VSX Registry"
          fi

          echo "vs_exists=$VS_EXISTS" >> $GITHUB_OUTPUT
          echo "ovsx_exists=$OVSX_EXISTS" >> $GITHUB_OUTPUT

          if [ "$VS_EXISTS" = "true" ] && [ "$OVSX_EXISTS" = "true" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "::notice::Version $VERSION exists in both marketplaces, skipping publish"
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "Publishing needed for at least one marketplace"
          fi

  publish:
    needs: check-version
    if: github.ref == 'refs/heads/main' && !inputs.dry_run && needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: editor-marketplace-production
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install -g @vscode/vsce@4.1.1 ovsx@1.4.0

      - name: Package extension
        run: |
          echo "Packaging extension..."
          vsce package --out "$RUNNER_TEMP/comphy-theme.vsix" || {
            echo "::error::Failed to package extension"
            exit 1
          }
          echo "::notice::Successfully packaged extension"

      - name: Publish to VS Marketplace
        if: needs.check-version.outputs.vs_exists != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_RELEASE_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          echo "Publishing version $VERSION to VS Marketplace..."
          : "${VSCE_PAT:?VS Marketplace release token is not configured}"
          vsce publish --packagePath "$RUNNER_TEMP/comphy-theme.vsix" || {
            echo "::error::Failed to publish to VS Marketplace"
            exit 1
          }
          echo "::notice::Successfully published to VS Marketplace"

      - name: Publish to Open VSX Registry
        if: needs.check-version.outputs.ovsx_exists != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_RELEASE_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          echo "Publishing version $VERSION to Open VSX Registry..."
          : "${OVSX_PAT:?Open VSX release token is not configured}"
          ovsx publish "$RUNNER_TEMP/comphy-theme.vsix" || {
            echo "::error::Failed to publish to Open VSX Registry"
            exit 1
          }
          echo "::notice::Successfully published to Open VSX Registry"

      - name: Publish Summary
        run: |
          echo "### Publishing Summary" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ needs.check-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- VS Marketplace: ${{ needs.check-version.outputs.vs_exists == 'true' && 'Already exists' || 'Published' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Open VSX Registry: ${{ needs.check-version.outputs.ovsx_exists == 'true' && 'Already exists' || 'Published' }}" >> $GITHUB_STEP_SUMMARY
